<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimCity Web Prototype</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #1a1a2e;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: Arial, sans-serif;
        font-size: 24px;
        text-align: center;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading SimCity...</div>
    <script>
      // Simple test to see if JavaScript runs
      console.log('Inline script running');
      document.getElementById('loading').textContent = 'JS is running...';
      setTimeout(function() {
        document.getElementById('loading').textContent = 'Loading Phaser module...';
      }, 100);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
